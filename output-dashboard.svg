<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="chartBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Power BI Window Frame -->
  <rect x="0" y="0" width="680" height="400" rx="14" fill="url(#dashBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Power BI Chrome Bar -->
  <rect x="0" y="0" width="680" height="44" rx="14" fill="#1b253b"/>
  <rect x="0" y="30" width="680" height="14" fill="#1b253b"/>
  <line x1="0" y1="44" x2="680" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Yellow Power BI Logo Icon -->
  <rect x="20" y="13" width="18" height="18" rx="4" fill="#f2c811"/>
  <rect x="23" y="19" width="3" height="9" fill="#000"/>
  <rect x="28" y="16" width="3" height="12" fill="#000"/>
  <rect x="33" y="14" width="3" height="14" fill="#000"/>

  <!-- Window Title -->
  <text x="50" y="27" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">Power BI • Commercial Fleet Fuel Analytics &amp; Cost Intelligence Dashboard</text>

  <!-- Export & Refresh Status -->
  <rect x="560" y="12" width="100" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="610" y="26" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">🔄 Auto-Sync 1m</text>

  <!-- Filter Slicers Bar -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="630" height="34" rx="6" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="14" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">SLICERS:</text>
    
    <rect x="75" y="6" width="105" height="22" rx="4" fill="rgba(0, 245, 212, 0.15)" stroke="#00f5d4" stroke-width="0.8"/>
    <text x="127" y="21" fill="#00f5d4" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Fuel: Diesel + EV</text>

    <rect x="190" y="6" width="115" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="247" y="21" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Time: FY2025-26 ▼</text>

    <rect x="315" y="6" width="120" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="375" y="21" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Region: All Corridors ▼</text>

    <rect x="445" y="6" width="90" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="490" y="21" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Fleet: Active</text>
  </g>

  <!-- Top KPI Cards Row -->
  <g transform="translate(25, 100)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="145" height="74" rx="8" fill="#131c2e" stroke="rgba(0, 245, 212, 0.3)" stroke-width="1"/>
    <text x="14" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">TOTAL FUEL COST</text>
    <text x="14" y="48" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">$42,850</text>
    <text x="14" y="65" fill="#10b981" font-family="'Inter', sans-serif" font-size="9" font-weight="600">▼ -8.4% vs Last Quarter</text>

    <!-- KPI 2 -->
    <rect x="160" y="0" width="145" height="74" rx="8" fill="#131c2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="174" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">AVG CONSUMPTION</text>
    <text x="174" y="48" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">6.4 <tspan font-size="12" fill="#94a3b8">gal/100mi</tspan></text>
    <text x="174" y="65" fill="#10b981" font-family="'Inter', sans-serif" font-size="9" font-weight="600">▲ +3.8% Efficiency</text>

    <!-- KPI 3 -->
    <rect x="320" y="0" width="145" height="74" rx="8" fill="#131c2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="334" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">ACTIVE FLEET UNITS</text>
    <text x="334" y="48" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">148 <tspan font-size="12" fill="#94a3b8">Vehicles</tspan></text>
    <text x="334" y="65" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9" font-weight="600">● 98.6% Operational</text>

    <!-- KPI 4 -->
    <rect x="480" y="0" width="150" height="74" rx="8" fill="#131c2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="494" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">EST. SAVINGS (DAX)</text>
    <text x="494" y="48" fill="#00f5d4" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">+$3,920</text>
    <text x="494" y="65" fill="#00f5d4" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Target Achieved</text>
  </g>

  <!-- Charts Row -->
  <g transform="translate(25, 185)">
    <!-- Chart 1: Bar Chart (Vehicle Class Consumption) -->
    <rect x="0" y="0" width="305" height="195" rx="8" fill="#111726" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="24" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Fuel Consumption by Vehicle Class (Gal)</text>
    
    <!-- Y-axis lines -->
    <line x1="45" y1="50" x2="285" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="45" y1="90" x2="285" y2="90" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="45" y1="130" x2="285" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="45" y1="165" x2="285" y2="165" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <text x="35" y="53" fill="#64748b" font-family="'Fira Code', monospace" font-size="8" text-anchor="end">12k</text>
    <text x="35" y="93" fill="#64748b" font-family="'Fira Code', monospace" font-size="8" text-anchor="end">8k</text>
    <text x="35" y="133" fill="#64748b" font-family="'Fira Code', monospace" font-size="8" text-anchor="end">4k</text>
    <text x="35" y="168" fill="#64748b" font-family="'Fira Code', monospace" font-size="8" text-anchor="end">0</text>

    <!-- Bars -->
    <!-- Heavy Truck -->
    <rect x="65" y="55" width="34" height="110" rx="3" fill="url(#chartBarGrad)"/>
    <text x="82" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Heavy</text>

    <!-- Medium Truck -->
    <rect x="125" y="85" width="34" height="80" rx="3" fill="url(#chartBarGrad)"/>
    <text x="142" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Medium</text>

    <!-- Cargo Vans -->
    <rect x="185" y="115" width="34" height="50" rx="3" fill="url(#chartBarGrad)"/>
    <text x="202" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Vans</text>

    <!-- Hybrid Fleet -->
    <rect x="245" y="140" width="34" height="25" rx="3" fill="#10b981"/>
    <text x="262" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Hybrid</text>

    <!-- Chart 2: Area Trend Chart (Cost Trend Across Months) -->
    <rect x="320" y="0" width="310" height="195" rx="8" fill="#111726" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="336" y="24" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Monthly Expenditure &amp; Budget Threshold</text>

    <!-- Grid lines -->
    <line x1="365" y1="50" x2="605" y2="50" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="365" y1="90" x2="605" y2="90" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="365" y1="130" x2="605" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="365" y1="165" x2="605" y2="165" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Budget line (dashed red/pink) -->
    <line x1="365" y1="75" x2="605" y2="75" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="600" y="70" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="8" text-anchor="end">Budget Limit ($15k)</text>

    <!-- Area Chart Path -->
    <polygon points="375,165 375,120 420,105 465,115 510,85 555,95 600,68 600,165" fill="url(#areaGrad)"/>
    <polyline points="375,120 420,105 465,115 510,85 555,95 600,68" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Data Points -->
    <circle cx="375" cy="120" r="3.5" fill="#f59e0b"/>
    <circle cx="420" cy="105" r="3.5" fill="#f59e0b"/>
    <circle cx="465" cy="115" r="3.5" fill="#f59e0b"/>
    <circle cx="510" cy="85" r="3.5" fill="#f59e0b"/>
    <circle cx="555" cy="95" r="3.5" fill="#f59e0b"/>
    <circle cx="600" cy="68" r="4.5" fill="#00f5d4" stroke="#ffffff" stroke-width="1"/>

    <!-- Month Labels -->
    <text x="375" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Jan</text>
    <text x="420" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Feb</text>
    <text x="465" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Mar</text>
    <text x="510" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Apr</text>
    <text x="555" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">May</text>
    <text x="600" y="180" fill="#00f5d4" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">Jun</text>
  </g>
</svg>
