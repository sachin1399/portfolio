  <!-- Assistant Voice Ingestion Badge -->
  <rect x="330" y="75" width="310" height="42" rx="8" fill="rgba(121, 40, 202, 0.15)" stroke="rgba(121, 40, 202, 0.4)" stroke-width="1"/>
