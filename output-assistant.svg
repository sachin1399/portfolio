  <text x="48" y="369" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="9">LATENCY: 290ms</text>

  <rect x="175" y="358" width="120" height="15" rx="3" fill="rgba(56, 189, 248, 0.1)"/>
  <text x="181" y="369" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">ENGINE: OpenAI-v4</text>

  <rect x="303" y="358" width="120" height="15" rx="3" fill="rgba(16, 185, 129, 0.1)"/>
  <text x="309" y="369" fill="#10b981" font-family="'Fira Code', monospace" font-size="9">AUDIO: gTTS+Pygame</text>
