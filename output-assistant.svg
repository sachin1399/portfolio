  <!-- Console Log Lines -->
  <text x="42" y="168" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">[14:32:01.082]</text>
  <text x="145" y="168" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="11">[SPEECH_RECOG]</text>
