    <rect x="0" y="8" width="5" height="18" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="9" y="4" width="5" height="26" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="18" y="1" width="5" height="32" rx="2.5" fill="url(#waveGrad)"/>
