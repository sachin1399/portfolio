  <text x="42" y="342" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="12" font-weight="700">assistant&gt;</text>
  <text x="135" y="342" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="12">Ready for next command...</text>
  <rect x="330" y="330" width="8" height="14" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Metrics Ribbon -->
