    <rect x="153" y="5" width="5" height="24" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="162" y="0" width="5" height="34" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="171" y="7" width="5" height="20" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="180" y="4" width="5" height="26" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="189" y="1" width="5" height="32" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="198" y="9" width="5" height="16" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="207" y="3" width="5" height="28" rx="2.5" fill="url(#waveGrad)"/>
    <rect x="216" y="0" width="5" height="34" rx="2.5" fill="url(#waveGrad)"/>
