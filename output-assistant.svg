<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="680" height="400" rx="14" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="680" height="42" rx="14" fill="#161d2e"/>
  <rect x="0" y="28" width="680" height="14" fill="#161d2e"/>
  <line x1="0" y1="42" x2="680" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- macOS Control Dots -->
  <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="21" r="6" fill="#27c93f"/>

  <!-- Title & Status -->
  <text x="340" y="26" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle" font-weight="600">voice_assistant_engine.py • Python 3.11</text>
  <rect x="545" y="12" width="115" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="558" cy="22" r="3.5" fill="#10b981"/>
  <text x="568" y="26" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="600">STATUS: LIVE</text>

  <!-- Audio Waveform Visualizer Section -->
