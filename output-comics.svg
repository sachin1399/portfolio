<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%">
  <defs>
    <linearGradient id="comicsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#182035"/>
    </linearGradient>
    <linearGradient id="panelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Browser Window Container -->
  <rect x="0" y="0" width="680" height="400" rx="14" fill="url(#comicsBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Browser Chrome Bar -->
  <rect x="0" y="0" width="680" height="46" rx="14" fill="#151c2e"/>
  <rect x="0" y="32" width="680" height="14" fill="#151c2e"/>
  <line x1="0" y1="46" x2="680" y2="46" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="58" cy="23" r="6" fill="#27c93f"/>

  <!-- URL Address Bar -->
  <rect x="90" y="10" width="480" height="26" rx="13" fill="#0b0f1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="110" y="27" fill="#10b981" font-family="'Fira Code', monospace" font-size="11">🔒 https://sachin1399.github.io/code-comics/issue-42</text>

  <!-- App Header & Navigation Inside Web App -->
  <rect x="25" y="60" width="630" height="40" rx="8" fill="#192238" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="42" y="85" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">⚡ CODE COMICS</text>

  <!-- Navigation Category Pills -->
  <rect x="200" y="69" width="70" height="22" rx="11" fill="url(#headerGrad)"/>
  <text x="235" y="84" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">All Issues</text>

  <rect x="280" y="69" width="75" height="22" rx="11" fill="rgba(255,255,255,0.06)"/>
  <text x="317" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Python Dev</text>

  <rect x="365" y="69" width="85" height="22" rx="11" fill="rgba(255,255,255,0.06)"/>
  <text x="407" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">CSS Nightmares</text>

  <rect x="460" y="69" width="70" height="22" rx="11" fill="rgba(255,255,255,0.06)"/>
  <text x="495" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Git Panic</text>

  <!-- Search / Reader Mode -->
  <rect x="560" y="69" width="80" height="22" rx="6" fill="rgba(0, 245, 212, 0.12)" stroke="#00f5d4" stroke-width="0.8"/>
  <text x="600" y="84" fill="#00f5d4" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">📖 Read Mode</text>

  <!-- Comic Strip Display Arena (3 Panels) -->
  <g transform="translate(25, 115)">
    <!-- Panel 1 -->
    <rect x="0" y="0" width="200" height="210" rx="10" fill="url(#panelGrad1)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
    <rect x="12" y="12" width="176" height="24" rx="6" fill="#3b82f6"/>
    <text x="100" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">PANEL 1: 11:30 PM</text>
    
    <!-- Code Graphic Panel 1 -->
    <rect x="12" y="44" width="176" height="100" rx="8" fill="#05070d"/>
    <text x="24" y="68" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="10">def build_portfolio():</text>
    <text x="36" y="86" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9">"Just a simple page"</text>
    <text x="36" y="104" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">return "html + css"</text>
    <text x="24" y="122" fill="#10b981" font-family="'Fira Code', monospace" font-size="9"># Simple enough, right?</text>

    <!-- Dialog Caption -->
    <rect x="12" y="152" width="176" height="46" rx="6" fill="#1e293b"/>
    <text x="20" y="170" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Dev: "I'll just make a standard</text>
    <text x="20" y="186" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">clean portfolio and sleep."</text>

    <!-- Panel 2 -->
    <rect x="215" y="0" width="200" height="210" rx="10" fill="url(#panelGrad1)" stroke="rgba(0, 245, 212, 0.3)" stroke-width="1.2"/>
    <rect x="227" y="12" width="176" height="24" rx="6" fill="#8b5cf6"/>
    <text x="315" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">PANEL 2: 02:45 AM</text>
    
    <!-- 3D Graphic Panel 2 -->
    <rect x="227" y="44" width="176" height="100" rx="8" fill="#05070d"/>
    <circle cx="315" cy="94" r="30" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="315,69 338,109 292,109" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <text x="315" y="132" fill="#00f5d4" font-family="'Fira Code', monospace" font-size="8" text-anchor="middle">*Three.js 3D Activated*</text>

    <!-- Dialog Caption -->
    <rect x="227" y="152" width="176" height="46" rx="6" fill="#1e293b"/>
    <text x="235" y="170" fill="#00f5d4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Dev: "Wait... what if I add</text>
    <text x="235" y="186" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">custom 3D cursor &amp; terminal?"</text>

    <!-- Panel 3 -->
    <rect x="430" y="0" width="200" height="210" rx="10" fill="url(#panelGrad1)" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
    <rect x="442" y="12" width="176" height="24" rx="6" fill="#10b981"/>
    <text x="530" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">PANEL 3: 05:00 AM</text>

    <!-- Masterpiece Panel 3 -->
    <rect x="442" y="44" width="176" height="100" rx="8" fill="#05070d"/>
    <text x="530" y="85" fill="#facc15" font-size="28" text-anchor="middle">🚀🔥</text>
    <text x="530" y="115" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ULTRA TECH PORTFOLIO!</text>

    <!-- Dialog Caption -->
    <rect x="442" y="152" width="176" height="46" rx="6" fill="#1e293b"/>
    <text x="450" y="170" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Recruiter: "10/10 developer</text>
    <text x="450" y="186" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">aesthetic. Hired!"</text>
  </g>

  <!-- Interactive Reader Engagement Footer Inside App -->
  <rect x="25" y="340" width="630" height="40" rx="8" fill="#141a2c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="42" y="365" fill="#f43f5e" font-size="14">❤️</text>
  <text x="62" y="365" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">1,842 Likes</text>

  <text x="160" y="365" fill="#38bdf8" font-size="14">💬</text>
  <text x="180" y="365" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">312 Comments</text>

  <text x="290" y="365" fill="#f59e0b" font-size="14">⭐</text>
  <text x="310" y="365" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">4.9 / 5.0 Rating</text>

  <rect x="520" y="348" width="120" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="580" y="364" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Next Comic ➔</text>
</svg>
